<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday 🎂</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ff4e8a,#6a5cff,#00c9ff,#ff4e8a);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
    position:relative;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    text-align:center;
    color:white;
    z-index:2;
}

.photo{
    width:220px;
    height:220px;
    object-fit:cover;
    border-radius:25px;
    border:4px solid white;
    box-shadow:0 0 30px white;
    animation:float 3s infinite ease-in-out;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

h1{
    margin-top:15px;
    font-size:32px;
}

p{
    font-size:20px;
    margin:15px 0;
    min-height:60px;
}

.btn{
    padding:15px 25px;
    border:none;
    border-radius:50px;
    background:white;
    color:#ff4e8a;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}

#giftMessage{
    margin-top:15px;
    opacity:0;
    transform:translateY(20px);
    transition:1s;
    font-size:22px;
}

.star{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite;
}

@keyframes twinkle{
    0%,100%{opacity:.2;}
    50%{opacity:1;}
}

.confetti{
    position:absolute;
    width:10px;
    height:10px;
    top:-10px;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}

canvas{
    position:absolute;
    top:0;
    left:0;
}

</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container">

    <img src="photo.jpg" class="photo">

    <h1 id="name">Happy Birthday 🎉</h1>

    <p id="text">كل سنة وانتي طيبة ❤️</p>

    <h2 id="giftMessage"></h2>

    <button class="btn" onclick="party()">افتح الهدية 🎁</button>

</div>

<audio id="music" loop>
    <source src="music.mp3">
</audio>

<script>

// ⭐ Stars
for(let i=0;i<80;i++){
    let star=document.createElement("div");
    star.classList.add("star");
    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";
    star.style.animationDuration=(Math.random()*3+1)+"s";
    document.body.appendChild(star);
}

// 🎯 اسم من اللينك
const params = new URLSearchParams(window.location.search);
let name = params.get("name");
if(name){
    document.getElementById("name").innerText = "Happy Birthday " + name + " 🎉";
}

// 🎁 Party function
function party(){

    document.getElementById("music").play();

    document.getElementById("text").innerText =
    "أنا مش بعرف أعبّر قوي... بس كل سنة وانتي أجمل حاجة حصلت ❤️";

    let gift=document.getElementById("giftMessage");
    gift.innerText="بحبك ❤️";
    gift.style.opacity="1";
    gift.style.transform="translateY(0)";

    // 🎊 Confetti
    for(let i=0;i<150;i++){
        let c=document.createElement("div");
        c.classList.add("confetti");
        c.style.left=Math.random()*100+"vw";
        c.style.background=`hsl(${Math.random()*360},100%,50%)`;
        c.style.animationDuration=(Math.random()*3+2)+"s";
        document.body.appendChild(c);

        setTimeout(()=>c.remove(),5000);
    }

    fireworks();
}

// 🎆 Fireworks
function fireworks(){
    const canvas=document.getElementById("fireworks");
    const ctx=canvas.getContext("2d");

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    let particles=[];

    function Particle(x,y){
        this.x=x;
        this.y=y;
        this.vx=(Math.random()-0.5)*5;
        this.vy=(Math.random()-0.5)*5;
        this.life=100;
    }

    for(let i=0;i<100;i++){
        particles.push(new Particle(canvas.width/2,canvas.height/2));
    }

    function animate(){
        ctx.clearRect(0,0,canvas.width,canvas.height);

        particles.forEach(p=>{
            p.x+=p.vx;
            p.y+=p.vy;
            p.life--;

            ctx.fillStyle="white";
            ctx.fillRect(p.x,p.y,2,2);
        });

        requestAnimationFrame(animate);
    }

    animate();
}

</script>

</body>
</html>
